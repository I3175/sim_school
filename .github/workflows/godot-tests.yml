name: Godot tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
      - name: Boot smoke test
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 2
      - name: GUT tests
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s addons/gut/gut_cmdln.gd -gexit

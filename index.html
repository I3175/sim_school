<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School &amp; Sprout</title>
  <link rel="stylesheet" href="game/style.css">
</head>
<body>
<main class="game-shell">
  <canvas id="world" tabindex="0" aria-label="Bản đồ game. WASD để di chuyển, E để tương tác."></canvas>
  <div class="world-top">
    <span id="world-location" hidden></span>
    <h1 id="location-name">Trường học Bình Minh</h1>
    <span id="location-type" hidden></span>
    <p id="location-description" hidden></p>
  </div>

  <section class="hud" aria-label="Lịch và tiền">
    <div class="clock-panel wood">
      <span id="season-icon" aria-hidden="true">✿</span>
      <div><small id="season-name">Mùa xuân</small><b id="day-time">Ngày 1 · 08:00</b></div>
    </div>
    <div class="money-panel wood"><span aria-hidden="true">●</span><b id="coins">30</b><small>xu</small></div>
    <button id="journal-toggle" class="wood journal-toggle" aria-controls="game-menu" aria-expanded="false">
      <kbd>J</kbd> Nhật ký <span id="quest-count">0/6</span>
    </button>
  </section>

  <section class="toolbar wood" aria-label="Dụng cụ và nông sản">
    <b id="tool-label" class="tool-label">Bàn tay</b>
    <button class="tool active" data-tool="hand" aria-label="1 Bàn tay" title="1 · Bàn tay"><kbd>1</kbd><span>✋</span></button>
    <button class="tool" data-tool="seed" aria-label="2 Hạt giống" title="2 · Hạt giống"><kbd>2</kbd><canvas data-icon="farm:seed-sacks" width="32" height="32"></canvas><b id="seed-count">12</b></button>
    <button class="tool" data-tool="water" aria-label="3 Bình tưới" title="3 · Bình tưới"><kbd>3</kbd><canvas data-icon="farm:watering-can" width="32" height="32"></canvas></button>
    <button class="tool" data-tool="rod" aria-label="4 Cần câu" title="4 · Cần câu"><kbd>4</kbd><canvas data-icon="fishing:rod" width="32" height="32"></canvas><b id="bait-count">6</b></button>
    <div class="tool harvest" title="Nông sản đã thu hoạch"><canvas data-icon="farm:carrot-basket" width="32" height="32"></canvas><b id="crop-count">0</b><small id="harvest-hint" hidden></small></div>
    <div class="tool harvest" title="Cá trong túi"><canvas data-icon="fish:carp" width="32" height="32"></canvas><b id="fish-count">0</b></div>
  </section>

  <div class="interaction wood" id="interaction"><kbd>E</kbd><div><b id="interaction-title"></b><small id="interaction-desc"></small></div></div>
  <div id="toast" class="wood" role="status" aria-live="polite"></div>
  <div class="quick-controls">
    <button id="help" class="wood" aria-label="Hướng dẫn" title="Hướng dẫn">?</button>
    <button id="sound" class="wood" aria-label="Bật âm thanh" title="Âm thanh">♪</button>
    <button id="fullscreen" class="wood" aria-label="Toàn màn hình" title="Toàn màn hình">⛶</button>
  </div>

  <aside id="game-menu" class="wood game-menu" aria-labelledby="menu-title" hidden>
    <button id="menu-close" class="close" aria-label="Đóng nhật ký">×</button>
    <span class="eyebrow">SCHOOL &amp; SPROUT</span>
    <h2 id="menu-title">Nhật ký</h2>
    <div class="menu-columns">
      <section>
        <div class="profile"><span id="level-label">Học sinh · Cấp 1</span><b>✦ <span id="xp">0</span> kiến thức</b></div>
        <div id="quests"></div>
        <div class="progress"><i id="quest-progress"></i></div>
      </section>
      <section>
        <canvas id="minimap" width="300" height="200" aria-label="Bản đồ khu vực"></canvas>
        <nav aria-label="Chuyển khu vực">
          <button class="map-tab active" data-map="school">Trường học</button>
          <button class="map-tab" data-map="farm">Nông trại</button>
        </nav>
        <div class="tip"><b id="tip-title"></b><p id="tip-body"></p></div>
      </section>
    </div>
    <div class="menu-actions">
      <button id="save">Lưu hành trình</button>
      <button id="pause">Ⅱ Tạm dừng</button>
      <button id="reset" class="secondary">Bắt đầu mới</button>
      <small id="save-status">Đã sẵn sàng</small>
    </div>
  </aside>

  <div id="loading"><span class="loader"></span><h2>Đang mở cổng trường…</h2><p id="loading-detail">Chuẩn bị bản đồ</p></div>

  <dialog id="dialog" class="wood">
    <button id="close-dialog" class="close" aria-label="Đóng">×</button>
    <span class="eyebrow" id="dialog-tag">KHÁM PHÁ</span>
    <h2 id="dialog-title"></h2>
    <div id="dialog-body"></div><div id="dialog-actions"></div>
  </dialog>
</main>
<script src="game/config.js"></script>
<script src="game/assets.js"></script>
<script src="game/core.js"></script>
<script src="game/farm-art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/terrain.js"></script>
<script src="game/game.js"></script>
</body>
</html>
